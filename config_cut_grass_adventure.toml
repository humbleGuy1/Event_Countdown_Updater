event_time = "2026-08-07 21:00"
timezone = "Europe/Moscow"

universe_id = "10410945205"
place_id = "90086669327265"
language_code = "en"
# "single" updates only language_code.
# "all_game_locales" updates the configured language, the source language,
# all supported languages, and any locales that already have icon overrides.
icon_language_mode = "all_game_locales"

base_title = "+1 Cut Grass Adventure"
title_template = "[{label}] {base_title}"

update_experience_title = true
update_place_title = true
update_icon = true

# Safety behavior when the event is farther away than the biggest stage.
# Use "skip" to do nothing, or "first" to use the biggest configured stage.
when_too_early = "skip"

# Most Roblox multipart image endpoints use a single image file field.
# Keep this configurable in case the endpoint expects a different field name.
icon_upload_field = "file"

# After the event passes, wait this long, then swap back to the default
# icon and base_title (no [LABEL] prefix). Set reset_icon = "" to disable.
reset_after = "1h"
reset_icon = "assets/cut_grass_adventure/default.png"
# Optional: override the title used during reset. Empty = use base_title.
reset_title = ""

